     <div class="container">
  <canvas id="myChart5"></canvas>
</div>
       <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <script>
   const data = {
        datasets: [
          {
            label: 'Dataset 1',
            data: [
              { x: 10, y: 20, r: 5 },
              { x: 15, y: 25, r: 10 },
              { x: 20, y: 30, r: 15 },
              { x: 25, y: 35, r: 20 },
              { x: 30, y: 40, r: 25 },
            ],
            borderColor: 'rgb(255, 99, 132)',
            backgroundColor: 'rgba(255, 99, 132, 0.5)',
          },
          {
            label: 'Dataset 2',
            data: [
              { x: 5, y: 10, r: 8 },
              { x: 10, y: 15, r: 12 },
              { x: 20, y: 25, r: 18 },
              { x: 30, y: 35, r: 22 },
              { x: 40, y: 45, r: 28 },
            ],
            borderColor: 'rgb(54, 162, 235)',
            backgroundColor: 'rgba(54, 162, 235, 0.5)',
          },
        ],
      };
      const config = {
        type: 'scatter',
        data: data,
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top',
            },
            title: {
              display: true,
              text: 'Allergy Season - Static Data',
            },
          },
          scales: {
            x: {
              title: {
                display: true,
                text: 'X Axis',
              },
            },
            y: {
              title: {
                display: true,
                text: 'Y Axis',
              },
            },
          },
        },
      };
         const myChart = new Chart(
        document.getElementById('myChart5'), 
        config
      );
      </script>
